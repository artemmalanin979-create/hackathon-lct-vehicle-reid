# Run from an assembled release directory with --env-file release.env.
# No automatic build/pull, no externally exposed storage, no destructive loader.
services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.15.5
    pull_policy: never
    mem_limit: 768m
    cpus: 1
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  seed:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    pull_policy: never
    mem_limit: 512m
    cpus: 1
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:?set QDRANT_COLLECTION}
      OPENBLAS_NUM_THREADS: 1
      PYTHONPATH: /srv
    volumes:
      - ./data:/data:ro
      - ./artifacts:/artifacts:ro
      - ./deploy:/deploy:ro
    command: ["python", "/deploy/seed_gallery.py"]
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"
  api:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    pull_policy: never
    mem_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1:${API_PORT:-18071}:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:?set QDRANT_COLLECTION}
      EXPECTED_GALLERY_POINTS: 750
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
      DEPLOYMENT_STATUS: ${DEPLOYMENT_STATUS:-DEPLOY PENDING}
    volumes:
      - ./data:/data:ro
      - ./materials:/materials:ro
      - ./deploy:/deploy:ro
    # ORT otherwise derives thread count from host CPUs despite a CPU quota.
    # Restrict this process to two of its allowed CPUs before loading the model.
    command: ["python", "-c", "import os; os.sched_setaffinity(0, sorted(os.sched_getaffinity(0))[:2]); import uvicorn; uvicorn.run('app.api.main:app', host='0.0.0.0', port=8000)"]
    healthcheck:
      test: ["CMD", "python", "/deploy/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      qdrant:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  qdrant:
